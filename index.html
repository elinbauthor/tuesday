<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tuesday</title>

<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#378ADD" />
<link rel="apple-touch-icon" href="tuesday-icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Tuesday" />

<style>
  html, body { margin:0; padding:0; background:#EEF3FA; }
  #boot {
    font:15px/1.6 "Inter","Helvetica Neue",Arial,sans-serif;
    color:#5E7180; padding:40px 20px; max-width:520px; margin:0 auto;
  }
  #boot h1 {
    font-family:"Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;
    font-weight:800; font-size:26px; letter-spacing:-0.025em; color:#10263C; margin:0 0 6px;
  }
  #boot code { font-size:12px; background:#fff; border:1px solid #CBD9E7; padding:1px 5px; }
  #boot .bad { color:#A33F2D; }
</style>
</head>
<body>

<div id="root"></div>

<div id="boot">
  <h1>Tuesday</h1>
  <p id="bootmsg">Starting…</p>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<script src="storage.js"></script>

<script>
  /* A blank screen is the worst failure mode, so anything that goes wrong
     before the app mounts gets reported here instead. */
  const bootEl = document.getElementById("boot");
  const msgEl = document.getElementById("bootmsg");

  function bootFail(what, detail) {
    msgEl.innerHTML =
      '<span class="bad">' + what + "</span><br><br>" +
      (detail ? "<code>" + String(detail).slice(0, 300) + "</code><br><br>" : "") +
      "Your wardrobe is not affected — it is stored on this device and this is only " +
      "a loading problem. Try a reload; if it persists on a phone, delete the home " +
      "screen icon and re-add it.";
  }

  window.addEventListener("error", (e) => {
    if (!document.querySelector("#root").childElementCount) {
      bootFail("Something failed while starting.", e.message);
    }
  });

  if (!window.React || !window.ReactDOM) {
    bootFail("Could not load React from the network.", "unpkg.com unreachable");
  } else if (!window.Babel) {
    bootFail("Could not load the compiler from the network.", "unpkg.com unreachable");
  } else if (!window.indexedDB) {
    bootFail("This browser has no IndexedDB, so nothing can be saved.", null);
  } else {
    msgEl.textContent = "Compiling…";
    fetch("app.jsx?v=1")
      .then((r) => {
        if (!r.ok) throw new Error("app.jsx returned " + r.status);
        return r.text();
      })
      .then((code) => {
        const out = Babel.transform(code, { presets: ["react"] }).code;
        const s = document.createElement("script");
        s.textContent = out;
        document.body.appendChild(s);
        bootEl.remove();
      })
      .catch((e) => bootFail("Could not start the app.", e.message));
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        /* offline support is a bonus; the app works without it */
      });
    });
  }
</script>
</body>
</html>
